<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Sprint</title>
  <style>
    :root {
      --cream: #f5f0e6;
      --cream-dark: #e8e0d0;
      --green: #1a3d2e;
      --green-mid: #2d5a45;
      --green-light: #4a7c59;
      --text: #1a2e24;
      --muted: #5c6b62;
      --danger: #8b3a3a;
      --danger-hover: #6e2e2e;
      --focus-ring: #2d5a45;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(26, 61, 46, 0.08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text);
      background: linear-gradient(165deg, var(--cream) 0%, var(--cream-dark) 100%);
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: 0.75rem 1rem;
      background: var(--green);
      color: var(--cream);
      z-index: 100;
    }

    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
    }

    header {
      background: var(--green);
      color: var(--cream);
      padding: 1.25rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    section {
      background: #fff;
      border: 1px solid rgba(26, 61, 46, 0.12);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    section h2 {
      margin: 0 0 1rem;
      font-size: 1.15rem;
      color: var(--green);
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      font-weight: 600;
      text-align: center;
      color: var(--green);
      margin: 0.5rem 0 1rem;
    }

    .timer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .task-stats {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .task-stats strong {
      color: var(--green);
    }

    .task-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .task-form label {
      width: 100%;
      font-weight: 500;
      color: var(--green-mid);
    }

    .task-form input[type="text"] {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.65rem 0.85rem;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius);
      font-size: 1rem;
    }

    .task-form input[type="text"]:focus {
      outline: none;
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(45, 90, 69, 0.25);
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 0.65rem 1rem;
      font-weight: 500;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--green);
      color: var(--cream);
    }

    .btn-primary:hover {
      background: var(--green-mid);
    }

    .btn-secondary {
      background: var(--cream-dark);
      color: var(--green);
    }

    .btn-secondary:hover {
      background: #ddd4c4;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(139, 58, 58, 0.35);
      padding: 0.4rem 0.65rem;
      font-size: 0.875rem;
    }

    .btn-danger:hover {
      background: rgba(139, 58, 58, 0.08);
      color: var(--danger-hover);
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-list:empty::after {
      content: "No tasks yet. Add one above to get started.";
      display: block;
      color: var(--muted);
      font-style: italic;
      padding: 0.5rem 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      background: var(--cream);
      border-radius: var(--radius);
      border: 1px solid rgba(26, 61, 46, 0.08);
    }

    .task-item.done .task-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-item input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--green);
      flex-shrink: 0;
    }

    .task-label {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0 1rem 1.5rem;
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <h1>Focus Sprint</h1>
    <p>25-minute focus sessions and simple task tracking</p>
  </header>

  <main id="main-content">
    <section aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus timer</h2>
      <p class="sr-only" id="timer-status" aria-live="polite">Timer ready. Twenty-five minutes.</p>
      <div class="timer-display" role="timer" aria-labelledby="timer-heading" aria-describedby="timer-status">
        <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
      </div>
      <div class="timer-controls">
        <button type="button" class="btn-primary" id="timer-start" aria-controls="timer-minutes timer-seconds">
          Start
        </button>
        <button type="button" class="btn-secondary" id="timer-pause" disabled>
          Pause
        </button>
        <button type="button" class="btn-secondary" id="timer-reset">
          Reset
        </button>
      </div>
    </section>

    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Tasks</h2>
      <p class="task-stats" aria-live="polite">
        <span id="task-count-label">Completed <strong id="task-completed">0</strong> of <strong id="task-total">0</strong> tasks</span>
      </p>

      <form class="task-form" id="task-form" aria-label="Add a new task">
        <label for="task-input">New task</label>
        <input
          type="text"
          id="task-input"
          name="task"
          autocomplete="off"
          maxlength="200"
          placeholder="What will you focus on?"
          required
        />
        <button type="submit" class="btn-primary">Add task</button>
      </form>

      <ul class="task-list" id="task-list" aria-label="Task list"></ul>
    </section>
  </main>

  <footer>
    MLH Global Hack Week — Challenge 1 · Data stays in your browser
  </footer>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "focus-sprint-tasks";
      var FOCUS_SECONDS = 25 * 60;

      var tasks = [];

      var taskForm = document.getElementById("task-form");
      var taskInput = document.getElementById("task-input");
      var taskList = document.getElementById("task-list");
      var taskCompletedEl = document.getElementById("task-completed");
      var taskTotalEl = document.getElementById("task-total");

      var timerMinutes = document.getElementById("timer-minutes");
      var timerSeconds = document.getElementById("timer-seconds");
      var timerStatus = document.getElementById("timer-status");
      var btnStart = document.getElementById("timer-start");
      var btnPause = document.getElementById("timer-pause");
      var btnReset = document.getElementById("timer-reset");

      var remainingSeconds = FOCUS_SECONDS;
      var timerInterval = null;
      var timerRunning = false;

      function generateId() {
        return "t-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
      }

      function loadTasks() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            tasks = [];
            return;
          }
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            tasks = [];
            return;
          }
          tasks = parsed.filter(function (item) {
            return item && typeof item.id === "string" && typeof item.text === "string" && typeof item.done === "boolean";
          });
        } catch (e) {
          tasks = [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          /* storage full or unavailable */
        }
      }

      function updateStats() {
        var total = tasks.length;
        var completed = tasks.filter(function (t) { return t.done; }).length;
        taskTotalEl.textContent = String(total);
        taskCompletedEl.textContent = String(completed);
      }

      function renderTasks() {
        taskList.innerHTML = "";
        tasks.forEach(function (task) {
          var li = document.createElement("li");
          li.className = "task-item" + (task.done ? " done" : "");
          li.dataset.id = task.id;

          var checkboxId = "task-check-" + task.id;

          var checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = checkboxId;
          checkbox.checked = task.done;
          checkbox.setAttribute("aria-label", "Mark \"" + task.text + "\" as done");

          var label = document.createElement("label");
          label.className = "task-label";
          label.setAttribute("for", checkboxId);
          label.textContent = task.text;

          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn-danger";
          delBtn.textContent = "Delete";
          delBtn.setAttribute("aria-label", "Delete task: " + task.text);

          checkbox.addEventListener("change", function () {
            task.done = checkbox.checked;
            saveTasks();
            renderTasks();
            updateStats();
          });

          delBtn.addEventListener("click", function () {
            tasks = tasks.filter(function (t) { return t.id !== task.id; });
            saveTasks();
            renderTasks();
            updateStats();
          });

          li.appendChild(checkbox);
          li.appendChild(label);
          li.appendChild(delBtn);
          taskList.appendChild(li);
        });
        updateStats();
      }

      function addTask(text) {
        var trimmed = text.trim();
        if (!trimmed) return;
        tasks.push({ id: generateId(), text: trimmed, done: false });
        saveTasks();
        renderTasks();
        taskInput.value = "";
        taskInput.focus();
      }

      taskForm.addEventListener("submit", function (e) {
        e.preventDefault();
        addTask(taskInput.value);
      });

      function padTwo(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function updateTimerDisplay() {
        var m = Math.floor(remainingSeconds / 60);
        var s = remainingSeconds % 60;
        timerMinutes.textContent = String(m);
        timerSeconds.textContent = padTwo(s);
      }

      function announceTimerStatus(message) {
        timerStatus.textContent = message;
      }

      function setTimerButtons() {
        btnStart.disabled = timerRunning;
        btnPause.disabled = !timerRunning;
        btnStart.textContent = remainingSeconds === 0 ? "Start again" : "Start";
      }

      function onTimerTick() {
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timerRunning = false;
          setTimerButtons();
          announceTimerStatus("Focus sprint complete. Great work!");
          return;
        }
        remainingSeconds -= 1;
        updateTimerDisplay();
        if (remainingSeconds === 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timerRunning = false;
          setTimerButtons();
          announceTimerStatus("Focus sprint complete. Great work!");
        }
      }

      function startTimer() {
        if (timerRunning) return;
        if (remainingSeconds === 0) {
          remainingSeconds = FOCUS_SECONDS;
          updateTimerDisplay();
        }
        timerRunning = true;
        setTimerButtons();
        announceTimerStatus("Timer running.");
        timerInterval = setInterval(onTimerTick, 1000);
      }

      function pauseTimer() {
        if (!timerRunning) return;
        timerRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        setTimerButtons();
        announceTimerStatus("Timer paused.");
      }

      function resetTimer() {
        pauseTimer();
        remainingSeconds = FOCUS_SECONDS;
        updateTimerDisplay();
        setTimerButtons();
        announceTimerStatus("Timer reset. Twenty-five minutes.");
      }

      btnStart.addEventListener("click", startTimer);
      btnPause.addEventListener("click", pauseTimer);
      btnReset.addEventListener("click", resetTimer);

      document.addEventListener("keydown", function (e) {
        if (e.target.closest("input, textarea, button")) {
          if (e.key === "Enter" && e.target === taskInput) return;
        }
        if (e.altKey && e.key === "s") {
          e.preventDefault();
          if (timerRunning) pauseTimer();
          else startTimer();
        }
        if (e.altKey && e.key === "r") {
          e.preventDefault();
          resetTimer();
        }
      });

      loadTasks();
      renderTasks();
      updateTimerDisplay();
      setTimerButtons();
    })();
  </script>
</body>
</html>
